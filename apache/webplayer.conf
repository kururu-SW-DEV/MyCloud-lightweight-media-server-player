Alias /player /shares/webplayer
<Directory /shares/webplayer>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>

    AddType application/wasm .wasm
    AddType font/woff2 .woff2
    AddType font/ttf .ttf

    <IfModule mod_headers.c>
        <FilesMatch "\.(css|js|wasm|woff2|ttf)$">
            Header set Cache-Control "max-age=604800, public"
        </FilesMatch>
        <FilesMatch "\.(html|htm)$">
            Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>
    </IfModule>

</Directory>

Alias /media /shares/Public
<Directory /shares/Public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    <IfModule mod_headers.c>
        Header set Accept-Ranges bytes
        Header set Access-Control-Allow-Origin "*"
    </IfModule>

    AddType video/mp4 .mp4
    AddType video/webm .webm
    AddType video/x-matroska .mkv
    AddType video/ogg .ogv
    AddType video/x-ms-wmv .wmv
    AddType video/mp2t .ts

    AddType text/vtt .vtt
    AddType text/plain;charset=utf-8 .smi .sami .srt .ass .ssa
    AddType font/ttf .ttf
    AddType font/otf .otf
    AddType font/woff2 .woff2
    AddType font/woff .woff
    AddType font/collection .ttc

    <IfModule mod_headers.c>
        <FilesMatch "\.(ttf|otf|ttc|woff2|woff)$">
            Header set Cache-Control "max-age=604800, public"
        </FilesMatch>
    </IfModule>
</Directory>
