# NAS's own admin dashboard (DocumentRoot=/var/www/htdocs, set in
# additional-httpd.conf) - port 9991 is forwarded straight to this Apache, so
# without this it's reachable from the internet with no login at all. LAN
# keeps normal access; anything else gets a flat 403, no Basic Auth prompt -
# this is the NAS admin surface, not worth gating behind the same
# throwaway password used for the media player.
<Directory "/var/www/htdocs">
    Require ip 192.168.0.0/24
</Directory>

Alias /player /shares/webplayer
<Directory /shares/webplayer>
    Options Indexes FollowSymLinks
    AllowOverride All
    AuthType Basic
    AuthName "MyCloud Player"
    AuthUserFile /etc/apache2/.htpasswd-webplayer
    <RequireAny>
        Require ip 192.168.0.0/24
        Require valid-user
    </RequireAny>
    DirectoryIndex index.html index.php
</Directory>

Alias /media /shares/Public
<Directory /shares/Public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    AuthType Basic
    AuthName "MyCloud Player"
    AuthUserFile /etc/apache2/.htpasswd-webplayer
    <RequireAny>
        Require ip 192.168.0.0/24
        Require valid-user
    </RequireAny>

    <IfModule mod_headers.c>
        Header set Accept-Ranges bytes
        Header set Access-Control-Allow-Origin "*"
    </IfModule>

    AddType video/mp4 .mp4
    AddType video/webm .webm
    AddType video/x-matroska .mkv
    AddType video/ogg .ogv

    AddType text/vtt .vtt
    AddType text/plain;charset=utf-8 .smi .sami .srt .ass .ssa
</Directory>
